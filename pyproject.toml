[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voidloops"
version = "0.0.1"
description = "Void Loops Studio — a pattern-based DAW built on top of Void Core."
requires-python = ">=3.12"
# Runtime dependency: the `voidcore` package, installed editable from its repo:
#   pip install -e C:/Users/migri/Documents/Projects/VoidCore
# It is intentionally NOT listed here as a PyPI dependency (it is a local editable
# install with a native libvoidcore.dll, not an index package). See README.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["voidloops*"]
